name: MLOps RAG CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (couverture minimale 70 %)
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Security - Bandit
        run: bandit -r src scripts

      - name: Security - pip-audit
        run: pip-audit

  evaluation-gate:
    needs: quality
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: extractive          # pas d'API externe en CI : deterministe et sans secret
      MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache des modeles d'embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('params.yaml') }}

      - name: Install dependencies (torch CPU)
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Recuperer le corpus (DVC)
        run: dvc pull

      - name: Evaluation du RAG
        run: python -m scripts.run_experiment --run-name ci

      - name: Quality gates (Recall@k, refus, exactitude)
        run: python -m scripts.check_gates

      - name: Publier les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-reports
          path: reports/

  staging:
    needs: evaluation-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Simulated deployment to staging
        run: echo "Deploy candidate to STAGING"

  production:
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production        # relecteur obligatoire (Settings > Environments)
    steps:
      - name: Simulated deployment to production
        run: echo "Deploy to PRODUCTION"
