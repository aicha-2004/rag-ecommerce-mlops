data:
  raw_dir: data/raw
  questions: data/eval/questions.yaml

chunking:
  chunk_size: 400
  chunk_overlap: 60

embedding:
  # "sentence-transformers" (reel) ou "hashing" (rapide, sans telechargement : tests)
  provider: sentence-transformers
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

retrieval:
  top_k: 3
  min_score: 0.225

llm:
  # "extractive" (sans API, deterministe) ou "groq"
  provider: extractive
  model: openai/gpt-oss-20b
  temperature: 0.0

quality_gate:
  min_recall_at_k: 0.80
  min_refusal_rate_oos: 0.80
  min_answer_accuracy: 0.70
  max_false_refusal_rate: 0.20
